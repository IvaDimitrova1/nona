<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعلم المفردات - Vocab Trainer</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #06b6d4;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.8);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --accent: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      margin-bottom: 25px;
      padding: 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #fff;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    select, button {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-main);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover, select:hover {
      background: var(--primary);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .mode-btn.active {
      background: var(--primary);
      border-color: var(--secondary);
      box-shadow: 0 0 12px rgba(79, 70, 229, 0.5);
    }

    main {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .section-panel {
      display: none;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.3s ease-in-out;
    }

    .section-panel.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 1. Flashcards Mode */
    .flashcard-container {
      perspective: 1000px;
      width: 100%;
      max-width: 450px;
      height: 280px;
      cursor: pointer;
      margin: 20px 0;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 16px;
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      background: rgba(15, 23, 42, 0.9);
    }

    .card-back {
      transform: rotateY(180deg);
      background: rgba(30, 27, 75, 0.95);
      border-color: var(--primary);
    }

    .word-title {
      font-size: 1.6rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 8px;
    }

    .word-desc {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .audio-btns {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      z-index: 5;
    }

    .audio-btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
    }

    .card-nav {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    /* 2. Matching Game */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      width: 100%;
      margin-top: 15px;
    }

    .match-card {
      padding: 15px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .match-card:hover {
      border-color: var(--primary);
      background: rgba(79, 70, 229, 0.2);
    }

    .match-card.selected {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.2);
    }

    .match-card.matched {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.2);
      opacity: 0.4;
      cursor: default;
    }

    /* 3. Quiz Mode */
    .quiz-box {
      width: 100%;
      max-width: 600px;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 20px;
      width: 100%;
    }

    .option-btn {
      width: 100%;
      text-align: right;
      padding: 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.7);
      justify-content: space-between;
    }

    /* 4. Spelling Mode */
    .spelling-box {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .score-board {
      margin-top: 15px;
      font-size: 1.1rem;
      color: var(--accent);
    }

    .feedback {
      min-height: 24px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎓 منصة حفظ المفردات التفاعلية</h1>
    <div class="controls">
      <select id="sectionSelect" onchange="changeSection()">
        <option value="all">كل الأقسام (Unit 1)</option>
        <option value="1.1">1.1 Our Practical Training</option>
        <option value="1.2">1.2 Working in a Canteen Kitchen</option>
        <option value="1.3">1.3 Working in a Hospital Ward</option>
      </select>

      <button class="mode-btn active" onclick="switchMode('flashcards')">🎴 البطاقات</button>
      <button class="mode-btn" onclick="switchMode('matching')">🧩 التوصيل</button>
      <button class="mode-btn" onclick="switchMode('quiz')">🔘 الاختيارات</button>
      <button class="mode-btn" onclick="switchMode('spelling')">✍️ الإملاء</button>
    </div>
  </header>

  <main>
    <!-- 1. Flashcards Panel -->
    <div id="flashcards" class="section-panel active">
      <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="cardInner">
          <div class="card-face card-front">
            <div class="word-title" id="fcEnglish">Word</div>
            <div class="word-desc" id="fcDesc">Description</div>
            <div class="audio-btns">
              <button class="audio-btn" onclick="speak(event, 'en')">🇬🇧 إنجليزي</button>
            </div>
          </div>
          <div class="card-face card-back">
            <div class="word-title" id="fcGerman">Wort</div>
            <div class="audio-btns">
              <button class="audio-btn" onclick="speak(event, 'de')">🇩🇪 ألماني</button>
            </div>
          </div>
        </div>
      </div>
      <div class="card-nav">
        <button onclick="prevCard()">السابق</button>
        <span id="cardProgress">1 / 10</span>
        <button onclick="nextCard()">التالي</button>
      </div>
    </div>

    <!-- 2. Matching Game Panel -->
    <div id="matching" class="section-panel">
      <p>اختر الكلمة بالإنجليزية ثم اختر معناها بالألمانية:</p>
      <div class="grid-container" id="matchingGrid"></div>
      <button style="margin-top: 15px;" onclick="initMatching()">إعادة اللعب 🔄</button>
    </div>

    <!-- 3. Quiz Panel -->
    <div id="quiz" class="section-panel">
      <div class="quiz-box">
        <div style="text-align: center; margin-bottom: 15px;">
          <h2 id="quizQuestion">Question</h2>
          <p id="quizDesc" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;"></p>
          <div class="audio-btns" style="justify-content: center; margin-top: 10px;">
            <button class="audio-btn" onclick="speakCurrentQuiz('en')">🇬🇧 استمع للإنجليزية</button>
            <button class="audio-btn" onclick="speakCurrentQuiz('de')">🇩🇪 استمع للألمانية</button>
          </div>
        </div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="score-board" id="quizScore">النقاط: 0</div>
      </div>
    </div>

    <!-- 4. Spelling Panel -->
    <div id="spelling" class="section-panel">
      <div class="spelling-box">
        <h2 id="spellingPrompt">Prompt</h2>
        <p id="spellingDesc" style="color: var(--text-muted);"></p>
        <div class="audio-btns">
          <button class="audio-btn" onclick="speakSpelling('de')">🇩🇪 استمع للكلمة بالألمانية</button>
        </div>
        <input type="text" id="spellingInput" placeholder="اكتب الترجمة الألمانية هنا..." autocomplete="off">
        <button onclick="checkSpelling()">تأكيد الإجابة</button>
        <div class="feedback" id="spellingFeedback"></div>
        <div class="score-board" id="spellingScore">النتيجة: 0</div>
      </div>
    </div>
  </main>

  <script>
    const vocabularyData = [
      // 1.1 Our Practical Training
      { sec: "1.1", en: "(to) attend", desc: "to go", de: "etwas besuchen, an etwas teilnehmen" },
      { sec: "1.1", en: "vocational school", desc: "a school for learning a job", de: "Berufsbildende Schulen" },
      { sec: "1.1", en: "housekeeper", desc: "someone who does domestic tasks in a household", de: "Hauswirtschafter/in" },
      { sec: "1.1", en: "male nurse", desc: "someone who takes care of ill people", de: "Krankenpfleger" },
      { sec: "1.1", en: "geriatric nurse", desc: "someone who takes care of old people", de: "Altenpfleger/in" },
      { sec: "1.1", en: "old people's home", desc: "a place where old people live", de: "Altersheim / Altenwohnheim" },
      { sec: "1.1", en: "surgical ward", desc: "block forming a division of a hospital shared by patients who need a similar kind of care after an operation", de: "chirurgische Station eines Krankenhauses" },
      { sec: "1.1", en: "(to) last", desc: "to take", de: "dauern" },
      { sec: "1.1", en: "(to) feel insecure", desc: "not to know if you do things right", de: "sich unsicher fühlen" },
      { sec: "1.1", en: "(to) be confused", desc: "unable to think with clarity", de: "verwirrt sein" },
      { sec: "1.1", en: "(to) scream", desc: "to cry loudly", de: "schreien" },
      { sec: "1.1", en: "(to) be proud", desc: "feeling self-respect", de: "stolz sein" },
      { sec: "1.1", en: "menu", desc: "a list of food which you can choose", de: "Speiseplan" },
      { sec: "1.1", en: "practical training", desc: "a place where you can go to learn about jobs", de: "Praktikumsplatz" },
      { sec: "1.1", en: "(to) sigh", desc: "breathe deeply", de: "seufzen" },
      { sec: "1.1", en: "(to) look tired", desc: "to look exhausted", de: "müde aussehen" },

      // 1.2 Working in a Canteen Kitchen
      { sec: "1.2", en: "tray", desc: "a box on which you can carry something, e.g. glasses, food", de: "Tablett" },
      { sec: "1.2", en: "dietician", desc: "a specialist in the study of nutrition", de: "Diätassistent/in" },
      { sec: "1.2", en: "(to) deliver", desc: "bring something to a destiny", de: "liefern" },
      { sec: "1.2", en: "food", desc: "things you can eat", de: "Nahrung / das Essen" },
      { sec: "1.2", en: "plate", desc: "a dish on which food is served", de: "Teller" },

      // 1.3 Working in a Hospital Ward
      { sec: "1.3", en: "(to) stare into space", desc: "stare into space", de: "Löcher in die Luft starren" },
      { sec: "1.3", en: "(to) take care of s.o.", desc: "to watch what somebody is doing", de: "sich um jemanden kümmern" },
      { sec: "1.3", en: "(to) be off sick", desc: "to be unable to go to work because of an illness", de: "krankgeschrieben sein" },
      { sec: "1.3", en: "(to) give s.o. a hand", desc: "to help somebody", de: "helfen" },
      { sec: "1.3", en: "(to) be in charge of s.o.", desc: "to be responsible for somebody", de: "verantwortlich sein für jemanden" },
      { sec: "1.3", en: "(to) shadow", desc: "to follow s.o. around", de: "hier: der Anleiterin folgen" },
      { sec: "1.3", en: "shy", desc: "lacking of self-confidence", de: "schüchtern sein" },
      { sec: "1.3", en: "(to) promise", desc: "to tell that you will do something", de: "versprechen" },
      { sec: "1.3", en: "(to) be sad", desc: "to feel unhappy", de: "traurig sein" },
      { sec: "1.3", en: "theatre", desc: "a place where people have an operation", de: "Operationssaal" }
    ];

    let currentSection = 'all';
    let filteredVocab = [...vocabularyData];
    let currentIndex = 0;

    // Speech Synthesis
    function speak(event, lang) {
      if(event) event.stopPropagation();
      const currentItem = filteredVocab[currentIndex];
      const text = lang === 'en' ? currentItem.en.replace(/\(to\)\s*/g, '') : currentItem.de;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'en' ? 'en-US' : 'de-DE';
      window.speechSynthesis.speak(utterance);
    }

    function filterData() {
      if (currentSection === 'all') {
        filteredVocab = [...vocabularyData];
      } else {
        filteredVocab = vocabularyData.filter(item => item.sec === currentSection);
      }
      currentIndex = 0;
    }

    function changeSection() {
      currentSection = document.getElementById('sectionSelect').value;
      filterData();
      updateFlashcard();
      initMatching();
      initQuiz();
      initSpelling();
    }

    function switchMode(modeId) {
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.section-panel').forEach(panel => panel.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(modeId).classList.add('active');

      if (modeId === 'matching') initMatching();
      if (modeId === 'quiz') initQuiz();
      if (modeId === 'spelling') initSpelling();
    }

    /* 1. Flashcards Logic */
    function flipCard() {
      document.getElementById('cardInner').classList.toggle('flipped');
    }

    function updateFlashcard() {
      document.getElementById('cardInner').classList.remove('flipped');
      setTimeout(() => {
        const item = filteredVocab[currentIndex];
        document.getElementById('fcEnglish').innerText = item.en;
        document.getElementById('fcDesc').innerText = item.desc;
        document.getElementById('fcGerman').innerText = item.de;
        document.getElementById('cardProgress').innerText = `${currentIndex + 1} / ${filteredVocab.length}`;
      }, 150);
    }

    function nextCard() {
      if (currentIndex < filteredVocab.length - 1) {
        currentIndex++;
        updateFlashcard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateFlashcard();
      }
    }

    /* 2. Matching Game Logic */
    let selectedCards = [];
    function initMatching() {
      const grid = document.getElementById('matchingGrid');
      grid.innerHTML = '';
      selectedCards = [];

      // Pick up to 6 random items
      const items = [...filteredVocab].sort(() => 0.5 - Math.random()).slice(0, 6);
      let cards = [];
      
      items.forEach((item, index) => {
        cards.push({ id: index, text: item.en, type: 'en' });
        cards.push({ id: index, text: item.de, type: 'de' });
      });

      cards.sort(() => 0.5 - Math.random());

      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'match-card';
        div.innerText = card.text;
        div.dataset.id = card.id;
        div.dataset.type = card.type;
        div.onclick = () => handleMatchSelect(div);
        grid.appendChild(div);
      });
    }

    function handleMatchSelect(card) {
      if (card.classList.contains('matched') || card.classList.contains('selected')) return;

      card.classList.add('selected');
      selectedCards.push(card);

      if (selectedCards.length === 2) {
        const [c1, c2] = selectedCards;
        if (c1.dataset.id === c2.dataset.id && c1.dataset.type !== c2.dataset.type) {
          c1.classList.remove('selected');
          c2.classList.remove('selected');
          c1.classList.add('matched');
          c2.classList.add('matched');
        } else {
          setTimeout(() => {
            c1.classList.remove('selected');
            c2.classList.remove('selected');
          }, 500);
        }
        selectedCards = [];
      }
    }

    /* 3. Quiz Logic */
    let currentQuizItem = null;
    let quizScore = 0;

    function initQuiz() {
      quizScore = 0;
      updateQuizScore();
      nextQuizQuestion();
    }

    function updateQuizScore() {
      document.getElementById('quizScore').innerText = `النقاط: ${quizScore}`;
    }

    function speakCurrentQuiz(lang) {
      if (!currentQuizItem) return;
      const text = lang === 'en' ? currentQuizItem.en.replace(/\(to\)\s*/g, '') : currentQuizItem.de;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'en' ? 'en-US' : 'de-DE';
      window.speechSynthesis.speak(utterance);
    }

    function nextQuizQuestion() {
      const optionsContainer = document.getElementById('quizOptions');
      optionsContainer.innerHTML = '';
      
      currentQuizItem = filteredVocab[Math.floor(Math.random() * filteredVocab.length)];
      document.getElementById('quizQuestion').innerText = currentQuizItem.en;
      document.getElementById('quizDesc').innerText = currentQuizItem.desc;

      // Generate Options
      let choices = [currentQuizItem];
      while (choices.length < 4 && choices.length < filteredVocab.length) {
        const rand = filteredVocab[Math.floor(Math.random() * filteredVocab.length)];
        if (!choices.includes(rand)) choices.push(rand);
      }
      choices.sort(() => 0.5 - Math.random());

      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = choice.de;
        btn.onclick = () => {
          if (choice === currentQuizItem) {
            btn.style.background = 'var(--success)';
            quizScore += 10;
          } else {
            btn.style.background = 'var(--danger)';
          }
          updateQuizScore();
          setTimeout(nextQuizQuestion, 800);
        };
        optionsContainer.appendChild(btn);
      });
    }

    /* 4. Spelling Logic */
    let currentSpellingItem = null;
    let spellingScore = 0;

    function initSpelling() {
      spellingScore = 0;
      document.getElementById('spellingScore').innerText = `النتيجة: ${spellingScore}`;
      nextSpellingPrompt();
    }

    function speakSpelling(lang) {
      if (!currentSpellingItem) return;
      const text = lang === 'en' ? currentSpellingItem.en.replace(/\(to\)\s*/g, '') : currentSpellingItem.de;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'en' ? 'en-US' : 'de-DE';
      window.speechSynthesis.speak(utterance);
    }

    function nextSpellingPrompt() {
      document.getElementById('spellingInput').value = '';
      document.getElementById('spellingFeedback').innerText = '';
      currentSpellingItem = filteredVocab[Math.floor(Math.random() * filteredVocab.length)];
      
      document.getElementById('spellingPrompt').innerText = currentSpellingItem.en;
      document.getElementById('spellingDesc').innerText = currentSpellingItem.desc;
    }

    function checkSpelling() {
      const input = document.getElementById('spellingInput').value.trim().toLowerCase();
      const target = currentSpellingItem.de.toLowerCase();
      const feedback = document.getElementById('spellingFeedback');

      if (input === target || target.includes(input) && input.length > 3) {
        feedback.innerText = '✨ إجابة صحيحة!';
        feedback.style.color = 'var(--success)';
        spellingScore += 10;
        document.getElementById('spellingScore').innerText = `النتيجة: ${spellingScore}`;
        setTimeout(nextSpellingPrompt, 1000);
      } else {
        feedback.innerText = `❌ إجابة خاطئة، الصحيح: ${currentSpellingItem.de}`;
        feedback.style.color = 'var(--danger)';
      }
    }

    // Initialize Page
    filterData();
    updateFlashcard();
  </script>
</body>
</html>
